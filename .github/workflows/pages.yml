name: Publish the site

# Builds the browser-side interface and publishes it to GitHub Pages.
#
# This is the always-on public URL. There is no server behind it: Whisper runs
# in the visitor's browser through Transformers.js, and the integration and
# grounding logic is the port in app/web/pipeline.js, which
# tests/test_browser_pipeline.py holds to the Python it mirrors.
#
# Free, permanent, and no account to arrange — GitHub Pages is already part of
# this repository.

on:
  push:
    branches: [main]
    paths:
      - "app/web/**"
      - "scripts/build_static.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run replaces a waiting one rather than
# racing it. `cancel-in-progress: false` so a deploy already uploading is
# allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the static site
        run: python -m scripts.build_static --pages

      - name: Check the build is self-contained
        # The build script already refuses absolute /static paths. This catches
        # the other way a project page breaks: a file the HTML references that
        # the build never copied.
        run: |
          set -euo pipefail
          test -f site/index.html
          for asset in styles.css fonts.css app.js pipeline.js browser-asr.js demo-data.js; do
            test -f "site/$asset" || { echo "::error::site/$asset is missing"; exit 1; }
          done
          test -d site/fonts/woff2
          echo "site/ contains $(find site -type f | wc -l) files"

      # `enablement: true` is deliberately not set: creating a Pages site is
      # owner-only, GITHUB_TOKEN cannot do it, and the attempt fails with
      # "Resource not accessible by integration" — which says nothing about
      # what to actually do.
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true

      - name: Pages has to be switched on once
        if: steps.pages.outcome == 'failure'
        run: |
          {
            echo "## One setting, once"
            echo
            echo "Open **[Settings → Pages](https://github.com/${{ github.repository }}/settings/pages)**"
            echo "and set **Source** to **GitHub Actions**."
            echo
            echo "Then re-run this workflow. Nothing else is needed — the build"
            echo "itself already succeeded."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::GitHub Pages is not enabled for this repository. Open Settings -> Pages, set Source to 'GitHub Actions', then re-run. Only the repository owner can do this; the workflow token cannot."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # ------------------------------------------------------------------
      # The public site lives in another organisation's repository, and
      # GITHUB_TOKEN is scoped to this one — so publishing there needs a token
      # of its own. Without it the build still succeeds and this step says what
      # is missing, rather than failing the run over an optional target.
      # ------------------------------------------------------------------
      - name: Publish to the public site
        id: mirror
        if: env.SITE_TOKEN != ''
        env:
          SITE_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
          SITE_REPO: vocalyze-ai/vocalyze-ai.github.io
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${SITE_TOKEN}@github.com/${SITE_REPO}.git" /tmp/site-repo

          # Replace the contents rather than merging into them, so a file
          # deleted here disappears there too instead of lingering forever.
          find /tmp/site-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R site/. /tmp/site-repo/

          cd /tmp/site-repo
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The public site already matches this build."
            exit 0
          fi
          git commit -q -m "Vocalyze site"
          git push -q
          echo "Published to https://vocalyze-ai.github.io/"

      - name: How to switch the public site on
        if: env.SITE_TOKEN == ''
        env:
          SITE_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          {
            echo "### The public site was not updated"
            echo
            echo "\`SITE_DEPLOY_TOKEN\` is not set, so **vocalyze-ai.github.io**"
            echo "still holds whatever was last put there by hand."
            echo
            echo "To make it automatic, once:"
            echo
            echo "1. Create a **fine-grained token**:"
            echo "   <https://github.com/settings/personal-access-tokens/new>"
            echo "   - Resource owner: \`vocalyze-ai\`"
            echo "   - Repository access: only \`vocalyze-ai.github.io\`"
            echo "   - Permissions: **Contents → Read and write**"
            echo "2. Add it here as a secret named \`SITE_DEPLOY_TOKEN\`:"
            echo "   <https://github.com/${{ github.repository }}/settings/secrets/actions/new>"
            echo
            echo "Every push to \`main\` publishes both sites after that."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::SITE_DEPLOY_TOKEN is not set — vocalyze-ai.github.io was not updated. See the run summary for the one-time setup."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Where it lives
        run: |
          {
            echo "## Your live site"
            echo
            echo "# ${{ steps.deployment.outputs.page_url }}"
            echo
            echo "Open it, tick the consent box, upload a recording. Whisper runs"
            echo "**in the browser** — the audio never leaves the device."
            echo
            echo "The first run downloads the model (about 80 MB) and the browser"
            echo "caches it. Later runs start immediately."
          } >> "$GITHUB_STEP_SUMMARY"
